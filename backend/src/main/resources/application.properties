spring.application.name=Core Backend
server.port=8081
server.servlet.context-path=/api

spring.devtools.remote.restart.enabled=false

# ===============================
# = DATA SOURCE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# DynamoDb Configuration
# ========================================
spring.cloud.aws.dynamodb.region=${AWS_REGION:-ap-southeast-1}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Shared region for S3 (match your AWS region)
spring.cloud.aws.region.static=ap-southeast-1

# Custom field for S3 bucket name
app.s3.bucket=${S3_BUCKET:}

# DynamoDB Table Names
app.dynamodb.table.tnc-agreement=${TNC_AGREEMENT_TABLE:}
app.dynamodb.table.project-plan=${PROJECT_PLAN_TABLE:}
app.dynamodb.table.project-document-status=${PROJECT_DOCUMENT_STATUS_TABLE:}
app.dynamodb.table.solar-monitoring=${SOLAR_MONITORING_TABLE:}
app.dynamodb.table.monitoring-report=${MONITORING_REPORT_TABLE:}

logging.level.root=INFO

# ===============================
# = MAIL (LOCAL SMTP: MailHog)
# ===============================
spring.mail.host=172.30.41.122
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=no-reply@gxcarbon.local
# Local testing only. Remove/disable in production.
app.mail.override-to=test@mailhog.local

