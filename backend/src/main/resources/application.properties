spring.application.name=Core Backend
server.port=8081
server.servlet.context-path=/api

spring.devtools.remote.restart.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# = DATA SOURCE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# DynamoDb / S3 Configuration
# ========================================
# Use the standard AWS SDK credential chain so AWS Toolkit / AWS CLI profiles work.
# This will resolve credentials from environment variables, shared config files,
# AWS CLI / Toolkit profiles, and instance metadata when available.
spring.cloud.aws.dynamodb.region=${AWS_REGION:ap-northeast-1}
spring.cloud.aws.region.static=${AWS_REGION:ap-northeast-1}
spring.cloud.aws.credentials.profile.name=${AWS_PROFILE:default}

# Custom field for S3 bucket name
app.s3.bucket=${S3_BUCKET:}

# DynamoDB Table Names
app.dynamodb.table.en_r002_application_confirmation=${EN_R002_APPLICATION_CONFIRMATION_TABLE:}
app.dynamodb.table.en_r002_sustainability_commitment=${EN_R002_SUSTAINABILITY_COMMITMENT_TABLE:}
app.dynamodb.table.project_participation_confirmation=${PROJECT_PARTICIPATION_CONFIRMATION:}
app.dynamodb.table.project-plan=${PROJECT_PLAN_TABLE:}
app.dynamodb.table.project-document-status=${PROJECT_DOCUMENT_STATUS_TABLE:}
app.dynamodb.table.solar-monitoring=${SOLAR_MONITORING_TABLE:}
app.dynamodb.table.monitoring-report=${MONITORING_REPORT_TABLE:}
# Short-lived security state: OTP challenges, send/rate-limit counters, action-link sessions
app.dynamodb.table.security-temp-state=${SECURITY_TEMP_STATE_TABLE:security_temp_state}

# Monitoring data retention (years) after a project is finalized, before its records are deleted
app.monitoring.retention.retention-years=2
# Scheduled deletion (削除) of monitoring data past retention. Off unless explicitly enabled.
app.monitoring.retention.auto-deletion-enabled=${MONITORING_AUTO_DELETION_ENABLED:false}
app.monitoring.retention.auto-deletion-cron=${MONITORING_AUTO_DELETION_CRON:0 0 2 * * *}
# Operators are notified this many days before the deletion date, and again on the day itself
app.monitoring.retention.advance-notice-days=7
# Nothing is deleted before this date (yyyy-MM-dd). Required: the job does not run while it is empty.
# Set to go-live date + advance-notice-days so projects already past retention still get both notices.
app.monitoring.retention.earliest-deletion-date=${MONITORING_EARLIEST_DELETION_DATE:}

logging.level.root=INFO

# ===============================
# = MAIL
# ===============================
# Delivery transport: smtp = local development (MailHog), ses = Amazon SES v2 SDK
app.mail.provider=${MAIL_PROVIDER:ses}

# Sender address. On SES this must be a verified identity (domain or email address).
app.mail.from=${MAIL_FROM:prabowo@kctgxzero.jp}

# Forces every recipient to this address. Local/staging testing only - leave empty in production.
# Also useful while the SES account is still in the sandbox, where only verified addresses can receive.
#app.mail.override-to=${MAIL_OVERRIDE_TO:}

# --- used only when provider=ses ---
# Falls back to spring.cloud.aws.region.static (= AWS_REGION) when empty.
app.mail.ses.region=${MAIL_SES_REGION:}
# Optional SES configuration set, for bounce / complaint event tracking.
app.mail.ses.configuration-set=${MAIL_SES_CONFIGURATION_SET:}

# --- used only when provider=smtp (MailHog) ---
spring.mail.host=${MAIL_HOST:172.30.41.122}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}

# ===============================
# = SECURITY LINKS / EMAIL OTP
# ===============================
app.security.frontend-base-url=${FRONTEND_BASE_URL:}
app.security.token-pepper=${SECURITY_TOKEN_PEPPER:}
app.security.otp-ttl=${SECURITY_OTP_TTL:}
app.security.otp-resend-cooldown=${SECURITY_OTP_RESEND_COOLDOWN:}
app.security.otp-max-attempts=${SECURITY_OTP_MAX_ATTEMPTS:}
app.security.otp-max-sends=${SECURITY_OTP_MAX_SENDS:}
app.security.otp-send-window=${SECURITY_OTP_SEND_WINDOW:}
app.security.master-setup-link-ttl=${MASTER_SETUP_LINK_TTL:}
app.security.master-setup-session-ttl=${MASTER_SETUP_SESSION_TTL:}
app.security.revision-link-ttl=${REVISION_LINK_TTL:}
app.security.revision-session-ttl=${REVISION_SESSION_TTL:}
app.security.password-reset-link-ttl=${PASSWORD_RESET_LINK_TTL:}
app.security.password-reset-session-ttl=${PASSWORD_RESET_SESSION_TTL:}
app.security.user-invitation-link-ttl=${USER_INVITATION_LINK_TTL:}
app.security.user-invitation-session-ttl=${USER_INVITATION_SESSION_TTL:}
app.security.terminal-retention-days=${SECURITY_LINK_RETENTION_DAYS:}
app.security.bcrypt-strength=${BCRYPT_STRENGTH:}
app.security.ip-max-requests=${SECURITY_IP_MAX_REQUESTS:}
app.security.ip-rate-window=${SECURITY_IP_RATE_WINDOW:}
app.security.features.signup-email-verification=${FEATURE_SIGNUP_EMAIL_VERIFICATION:}
app.security.features.master-setup-link=${FEATURE_MASTER_SETUP_LINK:}
app.security.features.rejected-signup-revision=${FEATURE_REJECTED_SIGNUP_REVISION:}
app.security.features.password-reset=${FEATURE_PASSWORD_RESET:}
app.security.features.login-email-otp=${FEATURE_LOGIN_EMAIL_OTP:}
app.security.features.user-invitation=${FEATURE_USER_INVITATION:}

# ===============================
# = DOCUSIGN CONFIGURATION
# ===============================
docusign.client-id=${DOCUSIGN_CLIENT_ID:}
docusign.user-id=${DOCUSIGN_USER_ID:}
docusign.account-id=${DOCUSIGN_ACCOUNT_ID:}
docusign.auth-server=${DOCUSIGN_AUTH_SERVER:account-d.docusign.com}
docusign.base-path=${DOCUSIGN_BASE_PATH:https://demo.docusign.net/restapi}
docusign.private-key-path=${DOCUSIGN_PRIVATE_KEY_PATH:}

# ===============================
# = FONT CONFIGURATION
# ===============================
app.pdf.japanese-font-path=${PDF_JAPANESE_FONT_PATH:}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:}
