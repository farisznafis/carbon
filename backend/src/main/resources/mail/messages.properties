# --- One-time action links (email) ---
# The shared warning block is spelled out per message rather than composed,
# because each flow words its expiry advice differently.
link.master-setup.subject=【マスターアカウント設定のお願い】
link.master-setup.body=いつもお世話になっております。\n\
\n\
ご登録内容が承認されましたのでお知らせいたします。\n\
企業ID: {0}\n\
\n\
つきましては、下記のリンクよりマスターアカウントのユーザー名とパスワードを設定してください。\n\
\n\
{1}\n\
\n\
【リンクに関するご注意】\n\
・このリンクは一度クリックすると無効になります(一回限り有効です)。同じリンクを再度開くことはできませんのでご注意ください。\n\
・このリンクの有効期限は発行から{2}です。期限を過ぎた場合は再度リンクの発行が必要となりますので、サポートまでお問い合わせください。\n\
・リンクを開いた後、設定を行うためのセッションの有効期限は{3}です。時間内に設定を完了してください。\n\
\n\
ご不明な点がございましたら、サポートまでお問い合わせください。

