# ==========================================================================
# Notification copy: email subject/body and in-app notification title/body.
#
# Placeholders are java.text.MessageFormat: {0}, {1}, ...
# Pass numeric arguments as String at the call site, otherwise MessageFormat
# adds locale grouping separators (id 1234 would render as "1,234").
#
# Resolved by service/NotificationMessages.java. Keys come in ".subject" and
# ".body" pairs; in-app notifications use .subject as the title.
# ==========================================================================

# --- Duration units, used inside the action-link bodies below ---
format.duration.days={0}日間
format.duration.hours={0}時間
format.duration.minutes={0}分

