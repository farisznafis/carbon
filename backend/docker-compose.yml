version: "3.9"

services:
  db:
    image:
    container_name:
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    ports:
      - ""
    volumes:
      - db_data:

  app:
    build: .
    container_name: core-backend-app
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL:
      SPRING_DATASOURCE_USERNAME:
      SPRING_DATASOURCE_PASSWORD:
      SERVER_PORT: 
    ports:
      - ""

volumes:
  db_data:
